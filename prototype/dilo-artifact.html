<style>

<script>
/* ================= AI 指令（與 Next.js 版 src/lib/ai/convert-prompt.ts 相同） ================= */
const PROMPT = "你是一位西班牙西文的口說教練，服務對象是母語為繁體中文、西文程度約 A2～B1 的學習者。學習者的目標是在和西班牙人視訊時，能把自己生活中的事說出口。\n\n你會收到一段 JSON，裡面有學習者寫的一段話（`user_text`），可能是中文、英文、寫錯的西文，或混在一起。請把它轉成學習者能理解、也能練習說出口的西文，並**只回傳符合指定格式的 JSON**，不要有任何其他文字。\n\n### 1. 語言與地區\n\n- 一律使用**西班牙本地的西文（es-ES）**，不要用拉丁美洲的說法。\n  - 例：室友 → compañero/a de piso（不是 compañero de cuarto）；你們 → vosotros（不是 ustedes）；電腦 → ordenador。\n- 所有給學習者看的說明（`meaning_zh`、`why_zh`、`zh` 等欄位）用**繁體中文**，簡短、口語，不用文法術語堆疊。\n\n### 2. 時態判斷（最重要）\n\n依照**內容講的是什麼時候**，對照 `written_at`（寫下的時間）和 `session`（早上計畫或晚上回顧）決定時態：\n\n| 內容的時間 | 時態 | 例子 |\n| --- | --- | --- |\n| 今天打算要做的事 | ir a + 原形動詞 | Hoy voy a trabajar en casa. |\n| 今天已經做的事（含今天早上、今天中午） | 現在完成式 pretérito perfecto | Hoy he trabajado mucho. |\n| 昨天或更早、已結束的時間點 | 簡單過去式 pretérito indefinido | Ayer fui al gimnasio. |\n| 過去「本來想要、打算」 | 未完成過去式 pretérito imperfecto | Quería ir pronto al gimnasio. |\n\n- 如果使用者寫「昨天」但 `written_at` 顯示其實是當天晚上寫的（例如寫成「昨天：今天我…」），以內容裡的「今天」為準，視為當天。\n- 在 `tense.why_zh` 用一句話說明為什麼用這個時態。\n- 簡單版盡量只用**一個時態**；自然版可以用到需要的時態。\n\n### 3. 拆成句塊\n\n- 把輸入拆成數個**句塊（chunk）**，每個句塊是一個能單獨說出口的意思，最多 6 個。\n- 不要合併成一個長句，也不要補上輸入裡沒有的內容。\n- 每個句塊標上它屬於哪一種對話動作 `conversation_action`：\n  - `say_today`：說自己做了或要做什麼\n  - `say_place`：說我們在哪裡、和誰在一起\n  - `ask_other`：問對方\n  - `react`：對別人的話做出反應\n\n### 4. 兩個版本\n\n每個句塊都要有：\n\n- `natural`（自然版）：母語者會說的自然說法，可以有慣用語（例：me he quedado viendo la tele）。\n- `simple`（簡單版）：讓學習者能在視訊中脫口而出的版本。\n  - 每句最多約 10 個字，避免從屬子句。\n  - 使用高頻詞彙，盡量只用一個時態。\n  - 必須文法正確，不能為了簡單而寫錯。\n\n### 5. 練習推薦\n\n- 從句塊中挑出 **1～2 個**最值得練習的，放在 `recommended_for_practice`。\n- 優先挑：視訊時最可能被問到、最能重複使用的句型（例：今天做了什麼、等一下要做什麼）。\n- 每個句塊給 `practice_priority`：1（最優先）到 3（可跳過）。\n\n### 6. 人物\n\n- `people` 是學習者已經設定過的人物清單，裡面有中文稱呼、西文說法和性別。遇到這些人時，**一律照清單的說法**。\n- 遇到清單裡沒有的人，而且西文需要知道性別或關係時（例：朋友、室友、同事）：\n  1. 先用陽性形式寫出句子，讓畫面可以先顯示。\n  2. 在 `questions` 加一題，問學習者這個人的性別，`options` 給出兩種西文說法。\n  3. 在 `new_people` 加入這個人，`gender` 填 `unknown`。\n- 不要自行猜測性別。\n\n### 7. 文化詞\n\n- 遇到台灣或亞洲特有的食物、地點、習俗（例：涮涮鍋、夜市、便當），在句子中保留通用的說法（例：shabu-shabu）。\n- 在 `culture_explanations` 附上一句**向西班牙人解釋**的簡單西文（例：Es como una fondue de caldo asiática.）和中文意思。\n\n### 8. 使用者寫了西文時\n\n- 如果 `user_text` 裡有西文，在 `corrections` 列出需要修正的地方：原本的寫法、修正後的寫法、一句中文說明。\n- 語氣友善，只說「這樣說會更自然／正確」，不要用「錯誤」這類字眼。\n- 寫對的部分不需要列出。\n\n### 9. 註解\n\n- 每個句塊的 `notes` 最多 3 則，挑學習者最可能不會的：新單字、西班牙特有說法、句型。\n- `type` 只能是 `vocab`、`grammar`、`spain_usage`、`culture` 其中之一。\n\n### 10. 不要做的事\n\n- 不要回傳 JSON 以外的任何文字。\n- 不要加入使用者沒說的事實、心情或細節。\n- 不要使用拉丁美洲說法。\n- 不要把多個句塊合成一個段落。";
const FORMAT = `回傳格式：只回傳下面這個 JSON 物件，欄位都要有（沒有內容就給空陣列）。
{"input_language":"zh|en|es|mixed","time_reference":"plan_today|today|yesterday_or_before|mixed",
"chunks":[{"id":"c1","source":"對應的原文","natural":"自然版","simple":"簡單版","meaning_zh":"中文意思",
"conversation_action":"say_today|say_place|ask_other|react",
"tense":{"name":"ir_a_infinitivo|preterito_perfecto|preterito_indefinido|preterito_imperfecto|presente","why_zh":"一句話說明"},
"notes":[{"type":"vocab|grammar|spain_usage|culture","es":"西文","zh":"中文說明"}],"practice_priority":1}],
"recommended_for_practice":["c1"],
"corrections":[{"original":"","corrected":"","why_zh":""}],
"questions":[{"id":"q1","about":"person_gender","person_label_zh":"朋友","question_zh":"……是男生還是女生？","options":[{"label_zh":"男生","es":"un amigo","gender":"m"},{"label_zh":"女生","es":"una amiga","gender":"f"}]}],
"new_people":[{"label_zh":"","es":"","gender":"f|m|unknown"}],
"culture_explanations":[{"term_zh":"","es":"","explain_es":"","explain_zh":""}]}`;

/* ================= constants ================= */
const ACTIONS = { say_today: "說今天", say_place: "說地點", ask_other: "問對方", react: "反應" };
const TENSES = { ir_a_infinitivo: "ir a + 原形動詞", preterito_perfecto: "現在完成式", preterito_indefinido: "簡單過去式", preterito_imperfecto: "未完成過去式", presente: "現在式" };
const STATUS = { new: ["新句子", ""], ok: ["說得出來", "ok"], stuck: ["卡住了", "stuck"] };
const RESCUE = [
  ["¿Me lo puedes repetir más despacio?", "可以說慢一點再說一次嗎？"],
  ["No lo he entendido, perdona.", "不好意思，我沒聽懂。"],
  ["¿Cómo se dice … en español?", "……用西文怎麼說？"],
];
const REACTS = [["¡Qué bien!", "太好了"], ["¡Qué guay!", "好酷"], ["¡Qué pena!", "好可惜"], ["¿En serio?", "真的嗎？"], ["Me alegro.", "真替你高興"], ["¡Qué rico!", "看起來好好吃"]];
const LOCAL_KEY = "dilo.v1";

/* ================= helpers ================= */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const dayKey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
function nowWithOffset() {
  const d = new Date(), o = -d.getTimezoneOffset(), sign = o >= 0 ? "+" : "-";
  return `${dayKey(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}${sign}${pad(Math.floor(Math.abs(o) / 60))}:${pad(Math.abs(o) % 60)}`;
}
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const ICON = {
  play: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>',
  today: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>',
  library: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5h10a3 3 0 0 1 3 3v12H8a3 3 0 0 1-3-3z"/><path d="M5 16.5a3 3 0 0 1 3-3h10M9 8h5"/></svg>',
  review: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="6" width="12" height="12" rx="3"/><path d="m15.5 10.5 5-3v9l-5-3"/></svg>',
};

/* ================= storage: claude db when available, this browser otherwise ================= */
let data = { profile: { people: [], days: {} }, sentences: [] };
const Store = {
  mode: "local", profileRef: null, sentCol: null, chain: Promise.resolve(),
  async init() {
    try {
      const raw = localStorage.getItem(LOCAL_KEY);
      if (raw) { const d = JSON.parse(raw); if (d && d.profile) data = { profile: { people: d.profile.people || [], days: d.profile.days || {} }, sentences: d.sentences || [] }; }
    } catch (e) {}
    try {
      if (!window.claude || !claude.use) return;
      const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
      if (!db || !user) return;
      const id = await user.id(); if (!id) return;
      this.profileRef = db.doc("data/users/" + id + "/profile");
      this.sentCol = this.profileRef.collection("sentences");
      const [p, s] = await Promise.all([this.profileRef.get(), this.sentCol.orderBy("createdAt", "desc").limit(1000).get()]);
      if (p.exists) { const v = p.data(); data.profile = { people: v.people || [], days: v.days || {} }; }
      data.sentences = s.docs.map(d => ({ ...d.data(), id: d.id }));
      this.mode = "cloud";
      try { const n = (await user.me()).name; if (n) S.name = n.trim().split(/\s+/)[0]; } catch (e) {}
    } catch (e) { this.mode = "local"; this.profileRef = null; this.sentCol = null; }
  },
  local() { try { localStorage.setItem(LOCAL_KEY, JSON.stringify(data)); } catch (e) {} },
  queue(fn) { this.chain = this.chain.then(fn).catch(() => { S.saveErr = "剛才的變更沒有存到雲端，重新整理前請先確認網路。"; render(); }); return this.chain; },
  saveProfile() {
    this.local();
    if (!this.profileRef) return;
    const body = JSON.parse(JSON.stringify(data.profile));
    return this.queue(() => this.profileRef.set(body));
  },
  addSentence(s) {
    data.sentences.unshift(s); this.local();
    if (!this.sentCol) return;
    const { id, ...body } = s;
    return this.queue(() => this.sentCol.doc(id).set(body));
  },
  updateSentence(id, patch) {
    const s = data.sentences.find(x => x.id === id); if (!s) return;
    Object.assign(s, patch); this.local();
    if (!this.sentCol) return;
    return this.queue(() => this.sentCol.doc(id).update(patch));
  },
  deleteSentence(id) {
    data.sentences = data.sentences.filter(x => x.id !== id); this.local();
    if (!this.sentCol) return;
    return this.queue(() => this.sentCol.doc(id).delete());
  },
};

/* ================= Claude ================= */
let samplePromise = null;
const getSample = () => samplePromise || (samplePromise = (window.claude && claude.use) ? claude.use("sample").catch(() => null) : Promise.resolve(null));

function errorText(e) {
  switch (e && e.code) {
    case "cancelled": return "";
    case "not_granted": case "sampling_disabled": case "not_declared": case "capability_disabled": case "capability_removed":
      S.aiOff = true; return "這裡沒辦法使用 Claude。請在 claude.ai 登入後打開這個頁面，並允許它使用 Claude。";
    case "rate_limited": return "Claude 的使用量暫時用完了，晚一點再試試。";
    case "session_expired": return "請重新登入 Claude 後再試。";
    case "invalid_json": case "empty_completion": return "這次回傳的格式不完整，請再按一次轉換。";
    case "refused": return "Claude 沒有處理這段內容，換個說法再試一次。";
    case "prompt_too_large": return "內容太長了，請分成幾段輸入。";
    default: return "連線出了點問題，請再試一次。";
  }
}

function normalizeResult(r) {
  const arr = v => Array.isArray(v) ? v : [];
  const chunks = arr(r && r.chunks).filter(c => c && c.simple && c.meaning_zh).slice(0, 6).map((c, i) => ({
    id: String(c.id || "c" + (i + 1)), source: String(c.source || ""), natural: String(c.natural || c.simple), simple: String(c.simple),
    meaning_zh: String(c.meaning_zh), conversation_action: ACTIONS[c.conversation_action] ? c.conversation_action : "say_today",
    tense: { name: String((c.tense && c.tense.name) || ""), why_zh: String((c.tense && c.tense.why_zh) || "") },
    notes: arr(c.notes).filter(n => n && n.es).slice(0, 3).map(n => ({ type: String(n.type || "vocab"), es: String(n.es), zh: String(n.zh || "") })),
    practice_priority: [1, 2, 3].includes(+c.practice_priority) ? +c.practice_priority : 2,
  }));
  if (!chunks.length) return null;
  const ids = new Set(chunks.map(c => c.id));
  let rec = arr(r.recommended_for_practice).map(String).filter(id => ids.has(id)).slice(0, 2);
  if (!rec.length) rec = [[...chunks].sort((a, b) => a.practice_priority - b.practice_priority)[0].id];
  return {
    chunks, recommended: rec,
    corrections: arr(r.corrections).filter(c => c && c.corrected),
    questions: arr(r.questions).filter(q => q && Array.isArray(q.options) && q.options.length >= 2).slice(0, 2),
    culture: arr(r.culture_explanations).filter(c => c && c.explain_es),
  };
}

async function convert() {
  const text = S.text.trim(); if (!text || S.busy) return;
  const sample = await getSample();
  if (!sample) { S.aiOff = true; S.err = errorText({ code: "not_granted" }); render(); return; }
  const input = {
    target_language: "es-ES", mode: "breakthrough", session: S.session, written_at: nowWithOffset(), user_text: text,
    people: data.profile.people,
  };
  if (S.session === "evening") {
    const plan = morningPlan();
    if (plan.length) input.morning_plan = plan.map(p => ({ es: p.simple, status: S.planStatus[p.id] || "done" }));
  }
  S.ctl = new AbortController(); S.busy = true; S.err = ""; S.result = null; S.view = "confirm"; render();
  try {
    const raw = await sample.json(`${PROMPT}\n\n${FORMAT}\n\n這次的輸入：\n${JSON.stringify(input)}`, { signal: S.ctl.signal, cache: false });
    const res = normalizeResult(raw);
    if (!res) throw { code: "invalid_json" };
    S.result = res;
  } catch (e) {
    S.err = errorText(e);
    if (e && e.code === "cancelled") S.view = "input";
  } finally { S.busy = false; S.ctl = null; render(); }
}

/* ================= speech ================= */
let voice = null;
function pickVoice() {
  try {
    const vs = speechSynthesis.getVoices();
    voice = vs.find(v => v.lang === "es-ES") || vs.find(v => /^es/i.test(v.lang)) || null;
  } catch (e) {}
}
try { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; } catch (e) {}
function speak(text) {
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/…/g, ""));
    u.lang = "es-ES"; if (voice) u.voice = voice; u.rate = .9;
    speechSynthesis.speak(u);
  } catch (e) { S.toast = "這個瀏覽器沒辦法播放發音。"; render(); }
}
const playBtn = (text, label = "播放發音") => `<button class="play" data-speak="${esc(text)}" aria-label="${label}">${ICON.play}</button>`;

  planStatus: {}, aiOff: false, name: "", saveErr: "", toast: "", returnTab: "today",

function dateLabel() { const d = new Date(); return `${d.getMonth() + 1}月${d.getDate()}日 星期${"日一二三四五六"[d.getDay()]}`; }

    <section class="stack" style="margin-top:var(--s16)">
      <p class="section-title">我的人物</p>
      ${people.length ? `<div class="row wrap">${people.map(p => `<span class="chip">${esc(p.label_zh)}：<span class="es" style="font-size:14px;color:var(--ink)">${esc(p.es)}</span><button class="link" style="font-size:13px;margin-left:4px" data-unperson="${esc(p.label_zh)}" aria-label="移除${esc(p.label_zh)}">×</button></span>`).join("")}</div>` : `<p class="sub">寫到室友、朋友這些人時，AI 會問一次是男生還是女生，答案會記在這裡。</p>`}
    </section>`;
}

function itemHTML(s) {
  const [label, cls] = STATUS[s.status] || STATUS.new, open = S.open === s.id;
  return `<div class="item">
    <button style="all:unset;cursor:pointer;display:flex;flex-direction:column;gap:6px" data-open="${s.id}" aria-expanded="${open}">
      <div class="between" style="align-items:flex-start"><p class="es grow">${esc(s.simple)}</p><span class="chip ${cls}">${label}</span></div>
      <p class="tiny">${esc(s.zh)}</p>
    </button>
    ${open ? `<div class="detail">
      ${s.natural && s.natural !== s.simple ? `<p class="es" style="font-size:17px;color:var(--ink-2)">自然版：${esc(s.natural)}</p>` : ""}
      ${s.tenseName ? `<p class="tense"><b>${esc(TENSES[s.tenseName] || s.tenseName)}</b>　${esc(s.tenseWhy || "")}</p>` : ""}
      ${s.notes && s.notes.length ? `<div class="notes">${s.notes.map(n => `<span class="chip"><span class="es">${esc(n.es)}</span>${esc(n.zh)}</span>`).join("")}</div>` : ""}
      <div class="between"><div class="row">${playBtn(s.simple)}<span class="tiny">${esc(s.day || "")} ${s.session === "evening" ? "晚上" : s.session === "morning" ? "早上" : ""}</span></div>
      ${S.confirmDel === s.id ? `<div class="row"><button class="link" data-del="${s.id}">確定刪除</button><button class="link" style="color:var(--ink-2)" data-act="cancel-del">取消</button></div>` : `<button class="link" style="color:var(--ink-2)" data-askdel="${s.id}">刪除</button>`}</div>
    </div>` : ""}
  </div>`;
}

function reviewQueue() {
  const stuck = data.sentences.filter(s => s.status === "stuck");
  const rest = data.sentences.filter(s => s.status !== "stuck");
  return [...stuck, ...rest].slice(0, 5);
}

function viewReview() {
  const q = reviewQueue();
  return `<header class="stack" style="gap:4px"><h1 class="title" style="font-size:26px">視訊前快速複習</h1><p class="sub">通話前把這些過一遍就好。點一下聽發音。</p></header>
    <p class="section-title">救命句</p>
    <div class="stack" style="gap:10px">${RESCUE.map(([es, zh]) => `<div class="phrase"><div class="grow"><p class="es">${esc(es)}</p><p class="tiny">${esc(zh)}</p></div>${playBtn(es)}</div>`).join("")}</div>
    <p class="section-title">反應短句</p>
    <div class="reacts">${REACTS.map(([es, zh]) => `<button data-speak="${esc(es)}"><span class="es">${esc(es)}</span><span class="tiny">${esc(zh)}</span></button>`).join("")}</div>
    <p class="section-title">我的句子</p>
    ${q.length ? `<div class="stack" style="gap:10px">${q.map(s => `<div class="phrase"><div class="grow"><p class="es">${esc(s.simple)}</p><p class="tiny">${esc(s.zh)}${s.status === "stuck" ? "・卡住了" : ""}</p></div>${playBtn(s.simple)}</div>`).join("")}</div>
      <button class="btn" data-act="practice-review">練習這 ${q.length} 句</button>` : `<p class="sub">句庫還沒有句子。寫下今天的一句後，這裡會列出最近和卡住的句子。</p>`}`;
}

/* ================= actions ================= */
async function saveResult(practice) {
  const r = S.result; if (!r) return;
  const k = dayKey(), rec = new Set(r.recommended), saved = [];
  for (const c of r.chunks) {
    const s = { id: uid(), simple: c.simple, natural: c.natural, zh: c.meaning_zh, action: c.conversation_action, tenseName: c.tense.name, tenseWhy: c.tense.why_zh,
      notes: c.notes, status: "new", stuckCount: 0, createdAt: Date.now(), day: k, session: S.session, source: c.source, recommended: rec.has(c.id) };
    Store.addSentence(s); saved.push(s);
  }
  const d = data.profile.days[k] || {};
  d[S.session] = { done: true, at: Date.now() };
  data.profile.days[k] = d;
  const keys = Object.keys(data.profile.days).sort(); while (keys.length > 120) delete data.profile.days[keys.shift()];
  Store.saveProfile();
  S.text = ""; S.result = null; S.planStatus = {};
  if (practice) { S.queue = saved.filter(s => s.recommended); S.qi = 0; S.revealed = false; S.hint = false; S.practiced = []; S.view = "practice"; }
  else { S.practiced = []; S.view = "done"; }
  render();
}

function answer(qid, idx) {
  const q = S.result && S.result.questions.find(x => String(x.id) === qid); if (!q) return;
  const o = q.options[+idx]; if (!o) return;
  const label = q.person_label_zh || o.es;
  data.profile.people = [...data.profile.people.filter(p => p.label_zh !== label), { label_zh: label, es: o.es, gender: o.gender === "f" ? "f" : "m" }];
  Store.saveProfile();
  convert();
}

document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const d = b.dataset;
  if (d.speak) { speak(d.speak); return; }
  if (d.tab) { S.tab = d.tab; S.view = "home"; S.open = null; render(); scrollTo(0, 0); return; }
  if (d.start) { S.session = d.start; S.view = "input"; S.err = ""; S.result = null; S.planStatus = {}; render(); scrollTo(0, 0); return; }
  if (d.example) { const ta = document.getElementById("entry"); S.text = (ta ? ta.value : S.text); S.text = (S.text ? S.text.replace(/\s*$/, "，") : "") + d.example; render(); const t2 = document.getElementById("entry"); if (t2) { t2.focus(); t2.setSelectionRange(t2.value.length, t2.value.length); } return; }
  if (d.plan) { const [id, st] = d.plan.split(":"); S.planStatus[id] = st; const ta = document.getElementById("entry"); if (ta) S.text = ta.value; render(); return; }
  if (d.answer) { const i = d.answer.lastIndexOf(":"); answer(d.answer.slice(0, i), d.answer.slice(i + 1)); return; }
  if (d.mark) {
    const s = S.queue[S.qi];
    Store.updateSentence(s.id, d.mark === "stuck" ? { status: "stuck", stuckCount: (s.stuckCount || 0) + 1, practicedAt: Date.now() } : { status: "ok", practicedAt: Date.now() });
    S.practiced.push(d.mark); S.qi++; S.revealed = false; S.hint = false;
    S.view = S.qi >= S.queue.length ? "done" : "practice"; render(); scrollTo(0, 0); return;
  }
  if (d.filter) { S.filter = d.filter; S.open = null; render(); return; }
  if (d.open) { S.open = S.open === d.open ? null : d.open; S.confirmDel = null; render(); return; }
  if (d.askdel) { S.confirmDel = d.askdel; render(); return; }
  if (d.del) { Store.deleteSentence(d.del); S.confirmDel = null; S.open = null; render(); return; }
  if (d.unperson) { data.profile.people = data.profile.people.filter(p => p.label_zh !== d.unperson); Store.saveProfile(); render(); return; }
  switch (d.act) {
    case "home": S.view = "home"; S.tab = "today"; S.err = ""; render(); scrollTo(0, 0); break;
    case "convert": { const ta = document.getElementById("entry"); if (ta) S.text = ta.value; if (!S.text.trim()) { S.err = "先寫下想說的話。"; render(); break; } convert(); scrollTo(0, 0); break; }
    case "stop": if (S.ctl) S.ctl.abort(); S.view = "input"; render(); break;
    case "edit": S.view = "input"; S.err = ""; render(); break;
    case "save-practice": saveResult(true); scrollTo(0, 0); break;
    case "save-only": saveResult(false); scrollTo(0, 0); break;
    case "hint": S.hint = true; render(); break;
    case "reveal": S.revealed = true; render(); break;
    case "quit": S.view = S.practiced.length ? "done" : "home"; render(); break;
    case "cancel-del": S.confirmDel = null; render(); break;
    case "practice-review": S.queue = reviewQueue(); S.qi = 0; S.revealed = false; S.hint = false; S.practiced = []; S.view = "practice"; render(); scrollTo(0, 0); break;
  }
});
document.addEventListener("input", e => { if (e.target.id === "entry") S.text = e.target.value; });

render();
Store.init().then(() => { getSample().then(s => { if (!s) S.aiOff = true; render(); }); render(); });
</script>
